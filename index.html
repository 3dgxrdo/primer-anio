<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciencia y Tecnología - Ciencias de la computación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: "Lato", system-ui, sans-serif; background: #fff; color: #fff; line-height: 1.4; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 3px; }

    .layout { display: flex; min-height: 100%; }

    /* Menú lateral */
    .sidebar {
      width: 243px; flex: 0 0 243px;
      position: sticky; top: 0; align-self: flex-start;
      height: 100vh; overflow-y: auto;
      background: #000; padding: 26px 18px 40px 40px;
    }
    .logo { display: block; width: 48px; height: auto; margin-bottom: 26px; }
    .site-title { display: block; font-size: 1.65rem; font-weight: 300; line-height: 1.3; margin-bottom: 62px; }
    .parent { display: flex; align-items: center; gap: 6px; margin-left: -22px; font-size: 1rem; padding: 8px 0 12px; }
    .parent svg { width: 16px; height: 16px; flex: none; }
    .sub { list-style: none; }
    .sub a { display: block; font-size: 1rem; padding: 10px 0; line-height: 1.3; }
    .sub a:hover { text-decoration: underline; }
    .sub a[aria-current="page"] { font-weight: 700; }

    /* Contenido */
    .content { flex: 1; min-width: 0; background: #fff; }
    .banner {
      min-height: 318px; padding: 70px 24px 40px; text-align: center;
      background: #0b4a9e url("img/banner.jpg") center / cover no-repeat;
    }
    .banner h1 { font-size: clamp(2.3rem, 5vw, 4rem); font-weight: 700; line-height: 1.15; }
    .banner p { margin-top: 24px; font-size: 1.5rem; font-weight: 400; }

    .slate { background: #313944; padding: 38px 69px 36px; }
    .slate h2 { font-size: 2.5rem; font-weight: 700; line-height: 1.2; }

    .cards { background: #fff; padding: 24px 61px 26px; }
    .card { display: block; width: 311px; max-width: 100%; }
    .card img { display: block; width: 100%; height: auto; }
    .btn {
      display: block; margin-top: 24px; padding: 7px 10px; border-radius: 3px;
      background: #313944; color: #fff; text-align: center; font-size: 1rem; font-weight: 400;
    }
    .card:hover .btn { background: #444e5c; }

    @media (max-width: 860px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; flex: none; position: static; height: auto; padding: 20px; }
      .site-title { margin-bottom: 20px; }
      .parent { margin-left: 0; }
      .banner { min-height: 240px; padding-top: 50px; }
      .slate { padding: 28px 20px; }
      .slate h2 { font-size: 1.9rem; }
      .cards { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <img class="logo" src="img/logo.png" alt="Gobierno de El Salvador">
      <a class="site-title" href="index.html">Ciencia y<br>Tecnología</a>
      <nav aria-label="Menú del sitio">
        <a class="parent" href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z" fill="currentColor"/></svg>
          Página principal
        </a>
        <ul class="sub">
          <li><a href="index.html" aria-current="page">Ciencias de la computación</a></li>
          <li><a href="primer-anio.html">Primer Año</a></li>
        </ul>
      </nav>
    </aside>

    <div class="content">
      <header class="banner">
        <h1>Ciencias de la computación</h1>
        <p>Educación Media</p>
      </header>
      <main>
        <section class="slate" aria-labelledby="recursos">
          <h2 id="recursos">Recursos educativos</h2>
        </section>
        <section class="cards" aria-label="Recursos educativos">
          <a class="card" href="primer-anio.html">
            <img src="img/primer-anio.jpg" alt="Ciencias de la computación, 1.º año de bachillerato: introducción a las ciencias de la computación, lógica de programación, estructura de datos, desarrollo básico de software, ciberseguridad y ciudadanía digital, fundamentos de inteligencia artificial">
            <span class="btn">Primer Año</span>
          </a>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
